<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Evil East Conquest</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: sans-serif;
    }

    canvas {
      aspect-ratio: 16 / 9;
      width: 100%;
      max-width: 100%;
      height: auto;
      background: #000000;
    }

    #loading {
      position: absolute;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-size: 24px;
      background: #000000;
      padding: 40px 60px;
      border-radius: 8px;
      border: 3px solid #666666;
    }

    #loading.hidden {
      display: none;
    }

    .spinner {
      border: 4px solid #666666;
      border-top: 4px solid #ff8c42;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-top: 30px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="loading">
    <div>Preloading engine bundle...</div>
    <div class="spinner"></div>
  </div>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <script src="mq_js_bundle.js"></script>
  <script src="jam_ld60_old_tech_history.js"></script>
  <script>
    function resizeCanvas() {
      const canvas = document.getElementById('glcanvas');
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      const aspect = 16 / 9;
      let newWidth, newHeight;

      if (windowWidth / windowHeight < aspect) {
        newWidth = windowWidth;
        newHeight = windowWidth / aspect;
      } else {
        newHeight = windowHeight;
        newWidth = windowHeight * aspect;
      }
      canvas.style.width = newWidth + 'px';
      canvas.style.height = newHeight + 'px';
    }

    canvas.addEventListener("contextmenu", function (e) {
      e.preventDefault();
    });

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('mousedown', function () {
      if (document.fullscreenElement === null && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(function () {});
      }
    }, { once: true });
  </script>
  <script>
    const originalInstantiate = WebAssembly.instantiate;
    WebAssembly.instantiate = function (...args) {
      return originalInstantiate.apply(this, args).then(result => {
        document.getElementById('loading').classList.add('hidden');
        return result;
      });
    };

    load("evil-east-conquest.wasm");
  </script>
</body>

</html>
